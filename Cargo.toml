[package]
name = "async-session"
version = "3.0.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/http-rs/async-session"
documentation = "https://docs.rs/async-session"
description = "Async session support with pluggable stores"
readme = "README.md"
edition = "2021"
keywords = []
categories = []
authors = [
  "Yoshua Wuyts <yoshuawuyts@gmail.com>",
  "Jacob Rothstein <hi@jbr.me>"
]

[dependencies]
async-trait = "0.1.92"
rand = "0.8.8"
base64 = "0.20.0"
sha2 = "0.10.9"
hmac = "0.12.1"
serde_json = "1.0.154"
bincode = "1.3.3"
anyhow = "1.0.104"
blake3 = "1.8.7"
async-lock = "2.8.0"
log = "0.4.34"

[dependencies.serde]
version = "1.0.229"
features = ["rc", "derive"]

[dependencies.time]
version = "0.3.55"
features = ["serde"]

[dev-dependencies.async-std]
version = "1.13.2"
features = ["attributes"]
